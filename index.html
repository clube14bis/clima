    function condicaoCena(codigo,atual={}){if(codigo>=96)return"tempestade-raios";if(codigo>=95)return"tempestade";if(codigo===45||codigo===48)return atual.visibility!=null&&atual.visibility<1000?"neblina-intensa":"neblina";if((atual.temperature_2m||0)>=35)return"calor-extremo";if(codigo>=65||codigo>=80)return"chuva-moderada";if(codigo>=51)return"chuva-fraca";if(codigoAnterior>=95)return"pos-tempestade";if(codigoAnterior>=51)return"pos-chuva";if(codigo===3)return"muito-nublado";if(codigo===1||codigo===2)return"parcialmente-nublado";return"ensolarado"}

    const orientacoes={chuva:["Não esqueça o <b>guarda-chuva</b> — há possibilidade de chuva nas condições atuais.","Cuidado ao voar seu <b>aeromodelo</b>: chuva deixa a pista e os equipamentos vulneráveis.","Proteja rádio, baterias e ferramentas antes de qualquer voo com chance de chuva.","Observe o céu e interrompa o voo ao primeiro sinal de pancadas mais fortes.","Com umidade elevada, confira conectores e mantenha o aeromodelo sempre seco.","Se a chuva aumentar, adie a decolagem e use o tempo para revisar seu equipamento."],vento:["Faça todos os <b>checklists</b> antes do voo — as rajadas exigem atenção extra.","Cuidado ao voar seu avião: o vento pode mudar rapidamente na aproximação.","Prefira modelos mais estáveis e mantenha uma margem maior para pousar.","Observe a biruta antes de decolar e a cada novo voo.","Vento e rajadas pedem comandos suaves e uma área livre para recuperar o modelo.","Se o vento aumentar, a decisão mais segura pode ser guardar o aeromodelo para depois."],sol:["Use <b>protetor solar</b> e não esqueça o boné antes de preparar seu avião.","Tempo aberto pede água por perto: mantenha-se hidratado entre os voos.","O sol está forte; proteja os olhos e confira se a tela do rádio continua visível.","Antes de voar, deixe baterias e eletrônicos fora do sol direto.","Aproveite o céu aberto, mas faça uma pausa à sombra entre as decolagens.","Calor e sol forte exigem atenção redobrada com crianças, pilotos e equipamentos."],noite:["A luz está baixa: só voe se você conhecer bem o campo e seu aeromodelo estiver adequado.","Antes de voar no fim do dia, confira iluminação, bateria e visibilidade do modelo.","Com pouca luz, reduza a distância e mantenha o avião sempre no campo de visão.","Evite voar sozinho à noite e informe alguém sobre sua atividade no campo.","No voo ao entardecer, faça um último checklist e planeje o pouso com antecedência.","Se a visibilidade cair, encerre o voo com calma e guarde o equipamento com segurança."],bom:["<b>Tempo bom para     function mensagemCampo(vento,rajada,chuva,uv,codigo){const h=new Date().getHours(),grupo=codigo===45||codigo===48?"neblina":chuva>=40||codigo>=51?"chuva":vento>15||rajada>28?"vento":h<6||h>=18?"noite":uv>=6?"sol":"bom",lista=window.bancoFrasesClima?.[grupo]||orientacoes[grupo]||orientacoes.chuva;return lista[Math.floor(Date.now()/600000)%lista.length]}

    async function carregarNoticias(){const lista=document.querySelector("#lista-noticias");if(!lista)return;const rss="https://news.google.com/rss/search?q=clima+Brasil&hl=pt-BR&gl=BR&ceid=BR:pt-419";try{const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(rss));const x=await r.json();if(x.status!=="ok"||!x.items?.length)throw Error();lista.replaceChildren(...x.items.slice(0,3).map(n=>{const a=document.createElement("a"),t=document.createElement("strong"),d=document.createElement("small");a.className="noticia";a.href=n.link;a.target="_blank";a.rel="noopener noreferrer";t.textContent=n.title;d.textContent=n.pubDate||"Notícia recente";a.append(t,d);return a}))}catch{lista.innerHTML='<p class="vazio">Não foi possível carregar as manchetes agora. <a href="https://news.google.com/search?q=clima%20Brasil&hl=pt-BR&gl=BR&ceid=BR%3Apt-419" target="_blank" rel="noopener noreferrer">Ver notícias recentes</a></p>'}}
    function renderizar(x){const c=x.current,d=x.daily,h=x.hourly,[ico,desc]=clima(c.weather_code),ch=d.precipitation_probability_max[0],s=avaliacao(c.wind_speed_10m,c.wind_gusts_10m,ch,d.uv_index_max[0],c.weather_code),agora=new Date();aplicarPaleta(c.weather_code,c);setTimeout(()=>{const tags=document.querySelector(".tags"),horaAtual=new Date().getHours(),tipo=c.weather_code>=51?"chuva":c.weather_code===45||c.weather_code===48?"neblina":horaAtual<5||horaAtual>=18?"noite":c.weather_code===2||c.weather_code===3?"nublado":"sol";if(tags)tags.insertAdjacentHTML("beforeend",`<span class="tag">🌅 Nascer do sol: ${hora(d.sunrise[0])}</span><span class="tag">🌇 Pôr do sol: ${hora(d.sunset[0])}</span>`);const arte=document.querySelector(".ilustracao");if(arte){arte.className=`ilustracao clima-logo ${tipo}`;arte.innerHTML='<img class="logo-card" src="logo14bis.png" alt="Clube de Aeromodelismo 14 BIS"><span class="gotas" aria-hidden="true"></span>'}},0);

    function iconeHora(codigo,momento,diario){const indice=diario.time.indexOf(momento.slice(0,10)),nascer=indice>=0?new Date(diario.sunrise[indice]):null,por=indice>=0?new Date(diario.sunset[indice]):null,agora=new Date(momento),noite=nascer&&por&&(agora<nascer||agora>=por);if(noite&&codigo<45)return svgClima("noite");return clima(codigo)[0]}
    function faseLua(data){const ciclo=29.53058867,referencia=Date.UTC(2000,0,6,18,14),idade=((((new Date(`${data}T12:00:00`).getTime()-referencia)/86400000)%ciclo)+ciclo)%ciclo;return idade<1.85?"Lua nova":idade<5.54?"Crescente":idade<9.23?"Quarto crescente":idade<12.92?"Gibosa crescente":idade<16.61?"Lua cheia":idade<20.3?"Gibosa minguante":idade<23.99?"Quarto minguante":"Minguante"}

    async function carregar(){const url="https://api.open-meteo.com/v1/forecast?latitude=-20.784833&longitude=-49.508769&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility&hourly=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max,uv_index_max,sunrise,sunset&timezone=America%2FSao_Paulo&forecast_days=7";try{const r=await fetch(url);if(!r.ok)throw Error();renderizar(await r.json())}catch{document.querySelector("#conteudo").innerHTML='<div>⚠️</div><h2>Não foi possível atualizar o clima</h2><p>Verifique sua conexão e tente consultar as condições novamente.</p><button class="tentar" type="button" onclick="carregar()">Tentar novamente</button>'}}
  </script>
