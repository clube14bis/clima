    /* Paleta que acompanha as condições atuais */
    :root { --fundo: #eaf1f7; --brilho: #cbe9ff; --hero-inicio: #072646; --hero-meio: #096395; --hero-fim: #2da8c5; }
    body { background: radial-gradient(circle at 86% 0, var(--brilho) 0, transparent 29rem), var(--fundo); transition: background .8s ease; }
    .hero { background: linear-gradient(132deg, var(--hero-inicio), var(--hero-meio) 57%, var(--hero-fim)); transition: background .8s ease; }
    /* Previsão diária detalhada */
    .dias { grid-auto-columns: minmax(225px, 1fr); grid-auto-flow: column; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
    .dia { display: block; min-height: 245px; padding: 16px; border: 1px solid #d5e1eb; border-radius: 19px; background: #fafdff; }
    .dia-cabeca { display: flex; align-items: center; justify-content: space-between; }
    .dia-cabeca strong { font-size: .95rem; }
    .dia .tempo { font-size: 1.7rem; }
    .temperaturas-dia { display: flex; align-items: baseline; gap: 8px; margin: 10px 0 14px; }
    .temperaturas-dia b { color: #102b42; font-size: 1.7rem; letter-spacing: -.055em; }
    .temperaturas-dia span { color: #5e7890; font-size: .88rem; }
    .detalhes-dia { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .detalhe-dia { min-height: 45px; padding: 7px 9px; border-radius: 10px; background: #eaf4fa; color: #526f85; font-size: .68rem; }
    .detalhe-dia b { display: block; margin-top: 2px; color: #173850; font-size: .82rem; }
    /* Destaque do relógio e saudação no cabeçalho */
    .saudacao {
      width: 100%;
      margin-top: 7px;
      color: #38637e;
      font-size: clamp(1rem, 3.8vw, 1.16rem);
      font-weight: 750;
      text-align: center;
    }
    .saudacao time { color: #60758b; font-weight: 550; }
    @media (max-width: 500px) { .saudacao { font-size: 1rem; } }
    .horarios-sol { grid-column: 1 / -1; margin: -2px 0 0; color: #56738a; font-size: .8rem; text-align: center; }
    /* Ajustes para telas compactas */
    html, body { overflow-x: hidden; }
    @media (max-width: 680px) {
      .topo { align-items: flex-start; }

      .atualizacao { display: none; }
      .hero-cabeca { align-items: flex-start; }

      .cartao { min-height: 113px; padding: 13px; border-radius: 17px; }

      .horas { grid-auto-columns: minmax(94px, 1fr); }

    @media (max-width: 600px) {

      /* No celular, deslize horizontalmente entre os dias, como nas próximas horas. */
      .colunas .dias { grid-auto-columns: minmax(225px, 1fr); grid-auto-flow: column; grid-template-columns: none; overflow-x: auto; overflow-y: hidden; padding-bottom: 8px; }
      .colunas .dia { min-height: 245px; }

      .situacao .vento small { overflow-wrap: anywhere; white-space: normal; }
    }
    /* Rolagem da previsão diária: funciona com gesto horizontal em telas pequenas. */
    .colunas .painel:first-child { min-width: 0; overflow: hidden; }
    .condicoes-principais { margin-top: 15px; }
    .extremos-hoje { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 10px; color: #fff; font-size: .88rem; }
    .extremos-hoje span { padding: 5px 9px; border: 1px solid #fff4; border-radius: 999px; background: #001b2b38; }
    .extremos-hoje b { margin-left: 4px; font-size: .96rem; }
    .rosa svg { width: 31px; height: 31px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .cartao-direcao { display: flex; flex-direction: column; justify-content: center; }
    /* Ajuste dos Meteocons de nascer e pôr do sol. */
    .cartao-icone.solar { display: grid; width: 48px; height: 48px; place-items: center; overflow: visible; }
    /* Maior contraste para os ícones da previsão diária. */
    .dia { background: #fff; }
    .dia .tempo { width: 64px; height: 64px; border: 1px solid #cfe2eb; border-radius: 18px; background: linear-gradient(145deg, #f6fcff, #e2f1f7); box-shadow: 0 5px 12px #163f5d10; }
    .dia .tempo .meteocon { width: 56px; height: 56px; }
    .dia-cabeca { gap: 10px; }
    .cartao-icone.solar.nascer { background: linear-gradient(135deg, #fff8d6, #ffe19a); }
    .cartao-icone.solar.por { background: linear-gradient(135deg, #ffe3bf, #ffc889); }
    .cartao-icone.solar::before, .cartao-icone.solar::after { content: none !important; }
    .cartao-icone.solar .meteocon { width: 44px; height: 44px; max-width: none; max-height: none; transform: translateZ(0); will-change: transform; }
    /* Painel aeronáutico — leitura clara, sem o antigo bloco escuro de vento. */
    .aviacao { padding: 0; overflow: hidden; border: 1px solid #c6dfe9; border-radius: 25px; background: linear-gradient(145deg, #fafdff, #e8f5fa); box-shadow: 0 8px 22px #1d54700f; }
    .aviacao-cabeca { padding: 20px 22px 16px; border-bottom: 1px solid #d5e8f0; background: linear-gradient(90deg, #fafdff, #e9f6fb); }
    .aviacao-cabeca h2 { display: flex; align-items: center; gap: 9px; color: #123b55; }
    .aviacao-cabeca h2::before { width: 10px; height: 10px; border-radius: 50%; background: #2e9ac2; box-shadow: 0 0 0 5px #2e9c221a; content: ""; }
    .aviacao-cabeca p { color: #59778a; }
    .aviacao-grade { display: block; margin: 0; padding: 16px 22px 8px; }
    .av-info { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .av-item { min-height: 82px; padding: 13px; border: 1px solid #d6e8ef; border-radius: 14px; background: #fff; box-shadow: 0 3px 9px #1d54700a; }
    .av-item small { color: #6a8798; font-weight: 700; letter-spacing: .025em; text-transform: uppercase; }
    .av-item b { color: #173d57; font-size: .91rem; line-height: 1.3; }
    .aviacao .vento-av { display: none; }
    .metar-leitura { margin: 8px 22px 0; padding: 14px; border-color: #cce3ed; border-radius: 16px; background: #fff; }
    .metar-dados { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-top: 0; }
    .metar-dado { min-height: 58px; border-radius: 11px; background: #f0f8fb; }
    .metar-bruto { background: #e9f4f8; color: #29536b; }
    .av-alerta { margin: 14px 22px 22px; border: 1px solid #f1dfaa; background: #fff9e8; color: #75541a; }
    @media (max-width: 760px) { .av-info { grid-template-columns: repeat(2, minmax(0, 1fr)); } .metar-dados { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 440px) { .aviacao-cabeca, .aviacao-grade { padding-right: 16px; padding-left: 16px; } .metar-leitura { margin-right: 16px; margin-left: 16px; } .av-alerta { margin-right: 16px; margin-left: 16px; } }
    .cartao-vento-completo { display: grid; grid-column: span 2; grid-template-columns: auto 1fr; align-items: center; column-gap: 13px; row-gap: 8px; }
    .vento-av { justify-content: center; padding: 0; background: transparent; }

    .cartao-vento-completo .direcao-vento b { display: block; color: #11283e; font-size: 1rem; }
    .cartao-vento-completo .direcao-vento small { display: block; margin-top: 3px; color: #667f94; font-size: .76rem; }
    .dados-vento { display: grid; grid-column: 1 / -1; grid-template-columns: 1fr 1fr; gap: 8px; }
    .dados-vento span { padding: 8px 9px; border-radius: 10px; background: #eaf4fa; color: #607b91; font-size: .7rem; }
    .dados-vento b { display: block; margin-top: 2px; color: #173850; font-size: .9rem; }

    .cartao-direcao .numero { margin-top: 10px; font-size: 1.08rem; }
    .colunas .dias { display: flex; width: 100%; gap: 10px; overflow-x: auto; overflow-y: hidden; padding: 0 0 14px; scroll-snap-type: x mandatory; scroll-padding-inline: 1px; scrollbar-color: #5e9fbd #e8f2f7; scrollbar-width: thin; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; touch-action: pan-x; }
    .colunas .dia { flex: 0 0 min(225px, 78vw); scroll-snap-align: start; }
    .colunas .dias::-webkit-scrollbar { height: 7px; }
    .colunas .dias::-webkit-scrollbar-track { border-radius: 99px; background: #e8f2f7; }

    /* Logo ampliada em 20% */
    .marca img { width: 168px; height: 124px; }
    @media (max-width: 500px) { .marca img { width: 121px; height: 102px; } }
    @media (max-width: 430px) { .marca img { width: 110px; height: 92px; } }
    /* Marca animada conforme o clima */
    .ilustracao { position: relative; overflow: hidden; isolation: isolate; font-size: 0; }
    .ilustracao.clima-logo { position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(#77cdf3, #dff5ff); }
    .ilustracao.clima-logo::after { z-index: 3; }
    .clima-logo .logo-card { display: none; }
    .hero::before { position: absolute; inset: 0; z-index: 0; content: ""; background: url("clube14bis.png") center 59% / cover no-repeat; opacity: .48; filter: saturate(.9) contrast(1.05); pointer-events: none; transition: filter .8s ease, opacity .8s ease; }
    .hero.noite::before { filter: brightness(.35) saturate(.6); opacity: .55; }
    .hero.chuva::before, .hero.neblina::before { filter: grayscale(.55) brightness(.67); opacity: .5; }
    .hero::after { z-index: 0; }
    .hero.chuva::after { inset: 0; width: auto; height: auto; border: 0; border-radius: 0; background: repeating-linear-gradient(112deg, transparent 0 17px, rgba(235,247,255,.62) 18px 20px, transparent 21px 37px); box-shadow: none; animation: chuva 1s linear infinite; }
    @media (max-width: 500px) { .hero::before { background-position: center center; opacity: .43; } }
    /* Foto do clube sem ícone circular ou anéis decorativos */
    .hero::after, .hero.chuva::after { display: none; }
    .hero .ilustracao { display: none; }

    function traduzirMetar(mensagem){const campos=[],vento=mensagem.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/),temperatura=mensagem.match(/\b(M?\d{2})\/(M?\d{2})\b/),pressao=mensagem.match(/\bQ(\d{4})\b/),nuvens=[...mensagem.matchAll(/\b(FEW|SCT|BKN|OVC)(\d{3})\b/g)];const grau=valor=>Number(valor.replace("M",""))*(valor.startsWith("M")?-1:1);if(vento){const direcao=vento[1]==="VRB"?"variável":`${vento[1]}°`,velocidade=Math.round(Number(vento[2])*1.852),rajada=vento[3]?` · rajadas ${Math.round(Number(vento[3])*1.852)} km/h`:"";campos.push(["Vento",`${direcao} · ${velocidade} km/h${rajada}`])}if(/\bCAVOK\b/.test(mensagem))campos.push(["Visibilidade","≥ 10 km · céu operacionalmente limpo"]);else if(/\b9999\b/.test(mensagem))campos.push(["Visibilidade","≥ 10 km"]);else{const visibilidade=mensagem.match(/\b(\d{4})\b/);if(visibilidade)campos.push(["Visibilidade",`${Number(visibilidade[1]) / 1000} km`])}if(temperatura)campos.push(["Temperatura",`${grau(temperatura[1])}°C · orvalho ${grau(temperatura[2])}°C`]);if(pressao)campos.push(["Pressão (QNH)",`${pressao[1]} hPa`]);if(nuvens.length){const nomes={FEW:"poucas",SCT:"dispersas",BKN:"muitas",OVC:"encoberto"};campos.push(["Nuvens",nuvens.map(item=>`${nomes[item[1]]} a ${Number(item[2])*100} ft`).join(" · ")])}return campos.map(([titulo,valor])=>`<div><dt>${titulo}</dt><dd>${valor}</dd></div>`).join("")}

    function adicionarRadarClube(){const ancora=document.querySelector("#metar-sao-jose")||document.querySelector("#mapa-operacional")||document.querySelector(".grade");if(!ancora||document.querySelector("#radar-clube"))return;const card=document.createElement("section");card.id="radar-clube";card.className="radar-clube";const radar="https://embed.windy.com/embed2.html?lat=-20.7848&lon=-49.5088&detailLat=-20.7848&detailLon=-49.5088&width=650&height=450&zoom=10&level=surface&overlay=rain&menu=&message=true&marker=true&calendar=now&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1";card.innerHTML=`<header class="radar-clube-cabeca"><div><h2>Radar de chuva</h2><p>Área do Clube 14 BIS · Mirassol</p></div><a href="https://www.windy.com/pt/-Radar-meteorol%C3%B3gico-radar?radar,-20.7848,-49.5088,10" target="_blank" rel="noopener noreferrer">Ver radar completo</a></header><div id="radar-clube-mapa" class="radar-mapa"><iframe src="${radar}" title="Radar meteorológico centrado no Clube 14 BIS" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><p class="radar-legenda">Radar de precipitação centrado no Clube 14 BIS. O mapa é exibido dentro deste painel.</p>`;ancora.insertAdjacentElement("afterend",card)}
    new MutationObserver(mudancas=>{const conteudoAlterado=mudancas.some(m=>m.target.id==="conteudo"||[...m.addedNodes].some(no=>no.nodeType===1&&(no.id==="conteudo"||no.querySelector?.("#conteudo"))));if(conteudoAlterado)setTimeout(()=>{organizarCartoesSolares();substituirIconesSvg();adicionarCamadasClima();adicionarPainelAviacao();adicionarMapaOperacional();adicionarMetarSaoJose();adicionarRadarClube();adicionarFontesMeteorologicas();posicionarCondicoes();adicionarDirecaoVento();mesclarInformacoesVento();substituirIconesMeteocons();removerResumoBussolaAviacao();adicionarIconesAviacao();padronizarHoras()},30)}).observe(document.body,{childList:true,subtree:true});
    atualizarSaudacao();setInterval(atualizarSaudacao,1000);setInterval(()=>aplicarPaleta(codigoAtual),60000);setInterval(carregar,900000);carregar();
    async function carregar(){const url="https://api.open-meteo.com/v1/forecast?latitude=-20.784833&longitude=-49.508769&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,visibility&hourly=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max,uv_index_max,sunrise,sunset&timezone=America%2FSao_Paulo&forecast_days=7";try{const r=await fetch(url);if(!r.ok)throw Error();renderizar(await r.json())}catch{document.querySelector("#conteudo").innerHTML='<div>⚠️</div><h2>Não foi possível atualizar o clima</h2><p>Verifique sua conexão e tente consultar as condições novamente.</p><button class="tentar" type="button" onclick="carregar()">Tentar novamente</button>'}}
  </script>
