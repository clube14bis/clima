name: Atualizar METAR mais próximo

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar observações METAR próximas ao Clube 14 BIS
        shell: bash
        run: |
          set -euo pipefail
          URL='https://aviationweather.gov/api/data/metar?format=json&bbox=-20.95,-49.75,-20.55,-49.25&hours=3'
          curl --fail --retry 3 --retry-delay 5 --silent --show-error "$URL" -o observacoes.json
          python3 scripts/atualizar_metar.py observacoes.json metar.json
      - name: Consultar METAR da REDEMET para São José do Rio Preto
        env:
          REDEMET_API_KEY: ${{ secrets.REDEMET_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$REDEMET_API_KEY" ]; then
            echo "Segredo REDEMET_API_KEY ainda não configurado; mantendo o último METAR publicado."
            exit 0
          fi
          curl --fail --retry 3 --retry-delay 5 --silent --show-error \
            -H "X-Api-Key: $REDEMET_API_KEY" \
            'https://api-redemet.decea.mil.br/mensagens/metar/SBSR?page_tam=1' \
            -o redemet-sao-jose.json
          python3 scripts/atualizar_redemet.py redemet-sao-jose.json metar-sao-jose.json
      - name: Salvar nova observação
        run: |
          if git diff --quiet -- metar.json metar-sao-jose.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metar.json metar-sao-jose.json
          git commit -m "Atualiza observações METAR"
          git push
